services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: worldmonitor
      POSTGRES_USER: worldmonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldmonitor -d worldmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  compound_api:
    build:
      context: ./services/compound_api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_WEATHER_API_KEY: ${GOOGLE_WEATHER_API_KEY:?GOOGLE_WEATHER_API_KEY not set}
      GOOGLE_WEATHER_BASE_URL: ${GOOGLE_WEATHER_BASE_URL:-https://weather.googleapis.com/v1}
      HAZARD_GRID_KM: ${HAZARD_GRID_KM:-25}
      HAZARD_MAX_POINTS: ${HAZARD_MAX_POINTS:-300}
      HAZARD_CACHE_TTL_MIN: ${HAZARD_CACHE_TTL_MIN:-60}
      WIND_THRESHOLD_KPH: ${WIND_THRESHOLD_KPH:-50}
      WIND_MAX_KPH: ${WIND_MAX_KPH:-120}
      RAIN_THRESHOLD_MM_HR: ${RAIN_THRESHOLD_MM_HR:-10}
      RAIN_MAX_MM_HR: ${RAIN_MAX_MM_HR:-50}
      HEAT_THRESHOLD_C: ${HEAT_THRESHOLD_C:-38}
      HEAT_MAX_C: ${HEAT_MAX_C:-48}
      FORECAST_HOURS: ${FORECAST_HOURS:-72}
      TIMESTEP_HOURS: ${TIMESTEP_HOURS:-0,6,12,24,48,72}
      DEFAULT_BBOX: ${DEFAULT_BBOX:-72.0,8.0,88.0,23.0}
      MAX_BBOX_AREA_DEG2: ${MAX_BBOX_AREA_DEG2:-50}
      MAX_QPS: ${MAX_QPS:-5}
      EVENT_LOOKBACK_HOURS: ${EVENT_LOOKBACK_HOURS:-72}
      ALERT_SCORE_THRESHOLD: ${ALERT_SCORE_THRESHOLD:-20}
      EVENT_TYPE_WEIGHTS_JSON: '${EVENT_TYPE_WEIGHTS_JSON:-{"PROTEST":1.2,"STRIKE":1.2,"CONFLICT":1.5,"DISASTER":1.4,"OUTAGE":1.3,"ACCIDENT":1.1,"OTHER":1.0}}'
    ports:
      - "8090:8090"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/compound/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestor:
    build:
      context: ./services/ingestor
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-15}
      GDELT_ENABLED: ${GDELT_ENABLED:-true}
      RELIEFWEB_ENABLED: ${RELIEFWEB_ENABLED:-true}
      RSS_ENABLED: ${RSS_ENABLED:-false}
      RSS_CONFIG_PATH: ${RSS_CONFIG_PATH:-/app/config/rss_feeds.yml}
      FOCUS_COUNTRIES: ${FOCUS_COUNTRIES:-IN,AE,GB,US}
      FOCUS_REGIONS: ${FOCUS_REGIONS:-EUROPE}
      EVENT_LOOKBACK_HOURS: ${EVENT_LOOKBACK_HOURS:-72}
    ports:
      - "8092:8092"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8092/ingestor/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  planner:
    build:
      context: ./services/planner
    environment:
      VITE_COMPOUND_API_URL: ${VITE_COMPOUND_API_URL:-http://compound_api:8090}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8091:8091"
    depends_on:
      compound_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_COMPOUND_API_URL: ${VITE_COMPOUND_API_URL:-http://localhost:8090}
        VITE_PLANNER_API_URL: ${VITE_PLANNER_API_URL:-http://localhost:8091}
    ports:
      - "3000:3000"
    depends_on:
      compound_api:
        condition: service_healthy
      ingestor:
        condition: service_healthy
      planner:
        condition: service_healthy

volumes:
  postgis_data:
