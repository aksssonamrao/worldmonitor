services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: corridorone
      POSTGRES_USER: corridorone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridorone -d corridorone"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.6.3
    restart: unless-stopped
    volumes:
      - ./valhalla_data:/data
    command: ["bash", "-lc", "valhalla_service /data/valhalla.json 1"]
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; body=b'{\\\"locations\\\":[{\\\"lat\\\":37.7749,\\\"lon\\\":-122.4194},{\\\"lat\\\":34.0522,\\\"lon\\\":-118.2437}],\\\"costing\\\":\\\"auto\\\"}'; req=urllib.request.Request('http://localhost:8002/route', data=body, headers={'Content-Type':'application/json'}); urllib.request.urlopen(req)\" || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s




  backend_api:
    build:
      context: ./services/backend_api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVENT_LOOKBACK_HOURS: ${EVENT_LOOKBACK_HOURS:-72}
      RSS_CONFIG_PATH: ${RSS_CONFIG_PATH:-/app/config/rss_feeds.yml}
      FOCUS_COUNTRIES: ${FOCUS_COUNTRIES:-IN,AE,GB,US}
      FOCUS_REGIONS: ${FOCUS_REGIONS:-EUROPE}
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-corridorone}
      ROUTE_SCORE_CACHE_RETENTION_DAYS: ${ROUTE_SCORE_CACHE_RETENTION_DAYS:-30}
      GOOGLE_WEATHER_API_KEY: ${GOOGLE_WEATHER_API_KEY:?GOOGLE_WEATHER_API_KEY not set}
      GOOGLE_WEATHER_BASE_URL: ${GOOGLE_WEATHER_BASE_URL:-https://weather.googleapis.com/v1}
      HAZARD_GRID_KM: ${HAZARD_GRID_KM:-25}
      HAZARD_MAX_POINTS: ${HAZARD_MAX_POINTS:-300}
      HAZARD_CACHE_TTL_MIN: ${HAZARD_CACHE_TTL_MIN:-60}
      WIND_THRESHOLD_KPH: ${WIND_THRESHOLD_KPH:-50}
      WIND_MAX_KPH: ${WIND_MAX_KPH:-120}
      RAIN_THRESHOLD_MM_HR: ${RAIN_THRESHOLD_MM_HR:-10}
      RAIN_MAX_MM_HR: ${RAIN_MAX_MM_HR:-50}
      HEAT_THRESHOLD_C: ${HEAT_THRESHOLD_C:-38}
      HEAT_MAX_C: ${HEAT_MAX_C:-48}
      FORECAST_HOURS: ${FORECAST_HOURS:-72}
      TIMESTEP_HOURS: ${TIMESTEP_HOURS:-0,6,12,24,48,72}
      DEFAULT_BBOX: ${DEFAULT_BBOX:-72.0,8.0,88.0,23.0}
      MAX_BBOX_AREA_DEG2: ${MAX_BBOX_AREA_DEG2:-50}
      MAX_QPS: ${MAX_QPS:-5}
      ALERT_SCORE_THRESHOLD: ${ALERT_SCORE_THRESHOLD:-20}
      EVENT_TYPE_WEIGHTS_JSON: ${EVENT_TYPE_WEIGHTS_JSON:-{"PROTEST":1.2,"STRIKE":1.2,"CONFLICT":1.5,"DISASTER":1.4,"OUTAGE":1.3,"ACCIDENT":1.1,"OTHER":1.0}}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      COMPOUND_API_URL: ${COMPOUND_API_URL_BACKEND:-http://localhost:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-20}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s



  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVENT_LOOKBACK_HOURS: ${EVENT_LOOKBACK_HOURS:-72}
      RSS_CONFIG_PATH: ${RSS_CONFIG_PATH:-/app/config/rss_feeds.yml}
      FOCUS_COUNTRIES: ${FOCUS_COUNTRIES:-IN,AE,GB,US}
      FOCUS_REGIONS: ${FOCUS_REGIONS:-EUROPE}
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-corridorone}
      ROUTE_SCORE_CACHE_RETENTION_DAYS: ${ROUTE_SCORE_CACHE_RETENTION_DAYS:-30}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-15}
      GDELT_ENABLED: ${GDELT_ENABLED:-true}
      RELIEFWEB_ENABLED: ${RELIEFWEB_ENABLED:-true}
      RSS_ENABLED: ${RSS_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVENT_LOOKBACK_HOURS: ${EVENT_LOOKBACK_HOURS:-72}
      RSS_CONFIG_PATH: ${RSS_CONFIG_PATH:-/app/config/rss_feeds.yml}
      FOCUS_COUNTRIES: ${FOCUS_COUNTRIES:-IN,AE,GB,US}
      FOCUS_REGIONS: ${FOCUS_REGIONS:-EUROPE}
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-corridorone}
      ROUTE_SCORE_CACHE_RETENTION_DAYS: ${ROUTE_SCORE_CACHE_RETENTION_DAYS:-30}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgis_data:
